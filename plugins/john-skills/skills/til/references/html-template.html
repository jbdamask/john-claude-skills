<!-- TIL HTML template. Replace {{PLACEHOLDERS}}; convert the Markdown body to HTML
     (bold labels become <strong>, code blocks become <pre><code>). Keep content
     identical to the Markdown version — this is presentation, not a rewrite. -->
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #0b6e4f;
    --code-bg: #f4f4f2;
    --border: #e4e4e0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181a; --fg: #e8e6e3; --muted: #9a9a94;
      --accent: #5fd3a5; --code-bg: #1f2225; --border: #2e3236;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181a; --fg: #e8e6e3; --muted: #9a9a94;
    --accent: #5fd3a5; --code-bg: #1f2225; --border: #2e3236;
  }
  body {
    background: var(--bg); color: var(--fg);
    font: 17px/1.6 Georgia, 'Times New Roman', serif;
    max-width: 42rem; margin: 0 auto; padding: 3rem 1.25rem 4rem;
  }
  .kicker {
    font: 700 0.75rem/1 -apple-system, 'Segoe UI', sans-serif;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
  }
  h1 { font-size: 1.75rem; line-height: 1.25; margin: 0.5rem 0 0.25rem; }
  .description { color: var(--muted); font-style: italic; margin: 0 0 1rem; }
  .meta {
    font: 0.8rem/1.4 -apple-system, 'Segoe UI', sans-serif; color: var(--muted);
    border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1.5rem;
  }
  .meta .tag {
    display: inline-block; background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 3px; padding: 0.05rem 0.4rem; margin-left: 0.3rem;
  }
  p { margin: 0 0 1rem; }
  strong { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 0.95em; }
  pre {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 0.9rem 1rem; overflow-x: auto; font-size: 0.85rem; line-height: 1.5;
  }
  code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
  p code { background: var(--code-bg); padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.85em; }
  img, svg { max-width: 100%; }
</style>

<p class="kicker">Today I Learned</p>
<h1>{{TITLE}}</h1>
<p class="description">{{DESCRIPTION}}</p>
<div class="meta">{{AUTHOR}} · {{DATE}} {{TAGS_AS_SPANS}}</div>

{{BODY_HTML}}
